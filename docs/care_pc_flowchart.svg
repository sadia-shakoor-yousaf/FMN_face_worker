<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 745" width="1100" height="1107" font-family="'Segoe UI', Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <marker id="mBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <marker id="mTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0d9488"/></marker>
    <marker id="mPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker>
    <marker id="mPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#db2777"/></marker>
    <marker id="mOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ea580c"/></marker>
    <marker id="mGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker>
    <marker id="mCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0891b2"/></marker>
    <marker id="mSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfdbfe"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdba74"/><stop offset="1" stop-color="#fed7aa"/></linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#bbf7d0"/></linearGradient>
    <linearGradient id="gCyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#a5f3fc"/></linearGradient>
  </defs>

  <rect width="740" height="745" fill="#ffffff"/>

  <!-- ================= CONTAINERS ================= -->
  <!-- Care PC -->
  <rect x="152" y="27" width="230" height="353" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
  <rect x="152" y="27" width="230" height="20" rx="3" fill="url(#gBlue)" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="160" y="41" font-size="9" font-weight="600" fill="#1e3a8a">Care PC (home / demo laptop)</text>

  <!-- Flutter app -->
  <rect x="402" y="298" width="262" height="76" rx="3" fill="#fff7ed" stroke="#f97316" stroke-width="1.3"/>
  <rect x="402" y="298" width="262" height="20" rx="3" fill="url(#gOrange)" stroke="#f97316" stroke-width="1.3"/>
  <text x="410" y="312" font-size="9" font-weight="600" fill="#7c2d12">Flutter app (same codebase)</text>

  <!-- Existing FMN backend -->
  <rect x="309" y="466" width="246" height="141" rx="3" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.3"/>
  <rect x="309" y="466" width="246" height="20" rx="3" fill="url(#gGreen)" stroke="#22c55e" stroke-width="1.3"/>
  <text x="317" y="480" font-size="9" font-weight="600" fill="#14532d">Existing FMN backend</text>

  <!-- Supabase Cloud -->
  <rect x="218" y="646" width="229" height="70" rx="3" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.3"/>
  <rect x="218" y="646" width="229" height="20" rx="3" fill="url(#gCyan)" stroke="#06b6d4" stroke-width="1.3"/>
  <text x="226" y="660" font-size="9" font-weight="600" fill="#164e63">Supabase Cloud</text>

  <!-- ================= CONNECTORS ================= -->
  <g fill="none" stroke-width="1.4" stroke-linejoin="round">
    <!-- Cam B -> fall_worker -->
    <path d="M204 93 V123" stroke="#2563eb" marker-end="url(#mBlue)"/>
    <!-- Cam A -> face_worker -->
    <path d="M326 93 V123" stroke="#0d9488" marker-end="url(#mTeal)"/>

    <!-- fall_worker -> YOLO -> features -> buffer -> LSTM -->
    <path d="M224 145 V160 H252 V177" stroke="#7c3aed" marker-end="url(#mPurple)"/>
    <path d="M252 201 V236" stroke="#7c3aed" marker-end="url(#mPurple)"/>
    <path d="M252 260 V291" stroke="#7c3aed" marker-end="url(#mPurple)"/>
    <path d="M252 315 V339" stroke="#7c3aed" marker-end="url(#mPurple)"/>

    <!-- fall_worker -> POST label -> FastAPI -->
    <path d="M174 145 V404 H85 V412" stroke="#2563eb"/>
    <path d="M85 442 V458 H347 V495" stroke="#2563eb" marker-end="url(#mBlue)"/>

    <!-- fall_worker -> Frames stay -->
    <path d="M192 145 V412" stroke="#64748b" marker-end="url(#mSlate)"/>

    <!-- face_worker -> visitor events -> FastAPI (dashed) -->
    <path d="M314 145 V428" stroke="#0d9488" stroke-dasharray="4 3"/>
    <path d="M350 438 H377 V495" stroke="#0d9488" stroke-dasharray="4 3" marker-end="url(#mTeal)"/>

    <!-- face_worker -> Qdrant (dashed) -->
    <path d="M342 145 V398 H636 V478 H490 V495" stroke="#db2777" stroke-dasharray="4 3" marker-end="url(#mPink)"/>
    <!-- Patient mode -> bearer -> Qdrant / backend (dashed) -->
    <path d="M578 374 V405" stroke="#db2777" stroke-dasharray="4 3"/>
    <path d="M578 425 V478" stroke="#db2777" stroke-dasharray="4 3"/>

    <!-- Caregiver UI -> bearer -> FastAPI -->
    <path d="M473 371 V405" stroke="#ea580c"/>
    <path d="M473 437 V450 H407 V495" stroke="#ea580c" marker-end="url(#mOrange)"/>

    <!-- Auth / JWT -> FastAPI -->
    <path d="M263 707 V728 H213 V452 H362 V495" stroke="#0891b2" marker-end="url(#mCyan)"/>

    <!-- FastAPI -> Postgres -->
    <path d="M375 529 V561" stroke="#16a34a" marker-end="url(#mGreen)"/>
    <!-- Postgres -> Realtime -->
    <path d="M376 597 V675" stroke="#16a34a" marker-end="url(#mGreen)"/>
    <!-- Realtime -> push new log row -> Caregiver UI -->
    <path d="M376 707 V728 H697 V286 H473 V333" stroke="#0891b2" marker-end="url(#mCyan)"/>
  </g>

  <!-- ================= NODES ================= -->
  <g filter="url(#sh)" font-size="9" text-anchor="middle">
    <!-- Cameras -->
    <rect x="163" y="55" width="82" height="38" rx="4" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.2"/>
    <text x="204" y="71" font-weight="600" fill="#134e4a">USB Cam B</text>
    <text x="204" y="83" fill="#115e59" font-size="8.5">fall / wide body</text>

    <rect x="285" y="55" width="82" height="38" rx="4" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.2"/>
    <text x="326" y="71" font-weight="600" fill="#134e4a">USB Cam A</text>
    <text x="326" y="83" fill="#115e59" font-size="8.5">face / doorway</text>

    <!-- Workers -->
    <rect x="163" y="123" width="82" height="22" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="204" y="137" font-weight="600" fill="#78350f">fall_worker.py</text>

    <rect x="273" y="123" width="82" height="22" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="314" y="137" font-weight="600" fill="#78350f">face_worker.py</text>

    <!-- Pipeline -->
    <rect x="211" y="177" width="82" height="24" rx="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="252" y="192" font-weight="600" fill="#4c1d95">YOLO11n-pose</text>

    <rect x="211" y="236" width="82" height="24" rx="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="252" y="251" font-weight="600" fill="#4c1d95">5 pose features</text>

    <rect x="200" y="291" width="104" height="24" rx="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="252" y="306" font-weight="600" fill="#4c1d95">Rolling window buffer</text>

    <rect x="211" y="339" width="82" height="24" rx="4" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.4"/>
    <text x="252" y="354" font-weight="700" fill="#3b0764">FallLSTM + NEED=2</text>

    <!-- Frames stay -->
    <rect x="145" y="412" width="105" height="26" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
    <text x="197" y="428" font-weight="600" fill="#1e293b">Frames stay on Care PC</text>

    <!-- Flutter nodes -->
    <rect x="417" y="333" width="112" height="38" rx="4" fill="#fed7aa" stroke="#ea580c" stroke-width="1.2"/>
    <text x="473" y="349" font-weight="600" fill="#7c2d12">Caregiver UI</text>
    <text x="473" y="362" fill="#9a3412" font-size="8.5">dashboard + activity logs</text>

    <rect x="545" y="333" width="110" height="38" rx="4" fill="#fed7aa" stroke="#ea580c" stroke-width="1.2"/>
    <text x="600" y="349" font-weight="600" fill="#7c2d12">Patient mode</text>
    <text x="600" y="362" fill="#9a3412" font-size="8.5">reminders / face announce</text>

    <!-- Backend nodes -->
    <rect x="337" y="495" width="76" height="34" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.3"/>
    <text x="375" y="509" font-weight="700" fill="#14532d">FastAPI :5155</text>
    <text x="375" y="521" fill="#166534" font-size="8.5">/api/v1/...</text>

    <rect x="433" y="495" width="112" height="34" rx="4" fill="#fbcfe8" stroke="#db2777" stroke-width="1.3"/>
    <text x="489" y="509" font-weight="700" fill="#831843">Qdrant</text>
    <text x="489" y="521" fill="#9d174d" font-size="8.5">face embeddings only</text>

    <rect x="319" y="561" width="115" height="36" rx="4" fill="#a7f3d0" stroke="#059669" stroke-width="1.3"/>
    <text x="376" y="576" font-weight="700" fill="#064e3b">Supabase Postgres</text>
    <text x="376" y="588" fill="#065f46" font-size="8.5">activity_logs + patients</text>

    <!-- Supabase cloud nodes -->
    <rect x="227" y="675" width="72" height="32" rx="4" fill="#a5f3fc" stroke="#0891b2" stroke-width="1.2"/>
    <text x="263" y="695" font-weight="600" fill="#164e63">Auth / JWT</text>

    <rect x="316" y="675" width="120" height="32" rx="4" fill="#a5f3fc" stroke="#0891b2" stroke-width="1.2"/>
    <text x="376" y="695" font-weight="600" fill="#164e63">Realtime on activity_logs</text>
  </g>

  <!-- ================= EDGE LABELS ================= -->
  <g font-size="8" text-anchor="middle" fill="#78350f">
    <rect x="40" y="412" width="90" height="30" rx="3" fill="#fffbeb" stroke="#fbbf24"/>
    <text x="85" y="425" font-weight="600">POST fall_detected JSON</text>
    <text x="85" y="436" fill="#b91c1c" font-weight="600">NO video</text>

    <rect x="290" y="428" width="60" height="20" rx="3" fill="#f0fdfa" stroke="#5eead4"/>
    <text x="320" y="441" fill="#115e59" font-weight="600">visitor events</text>

    <rect x="423" y="405" width="100" height="32" rx="3" fill="#fff7ed" stroke="#fdba74"/>
    <text x="473" y="418" font-weight="600" fill="#9a3412">Bearer token</text>
    <text x="473" y="429" fill="#9a3412">CRUD patients/reminders</text>

    <rect x="551" y="405" width="54" height="20" rx="3" fill="#fdf2f8" stroke="#f9a8d4"/>
    <text x="578" y="418" fill="#9d174d" font-weight="600">Bearer token</text>

    <rect x="663" y="700" width="68" height="16" rx="3" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="697" y="711" fill="#155e75" font-weight="600">push new log row</text>
  </g>
</svg>
